name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural validation
        run: python3 scripts/validate.py nonprofit-grant-operations
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude plugin validate (documented CLI command)
        run: npx --yes @anthropic-ai/claude-code plugin validate .
